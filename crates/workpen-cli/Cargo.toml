[package]
name = "workpen-cli"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for Workpen: dest-deny and a per-child process jail."
publish = true
readme = "../../README.md"
keywords = ["sandbox", "cli", "landlock", "seatbelt", "security"]
categories = ["command-line-utilities", "os"]

[[bin]]
name = "workpen"
path = "src/main.rs"

[dependencies]
workpen = { version = "0.5.0", path = "../workpen", features = ["gc", "nono"] }

[dev-dependencies]
tempfile = "3"

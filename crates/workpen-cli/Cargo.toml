[package]
name = "workpen-cli"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for Workpen: dest-deny and a per-child process jail."
publish = true
readme = "../../README.md"
keywords = ["sandbox", "cli", "landlock", "seatbelt", "security"]
categories = ["command-line-utilities", "os"]

[[bin]]
name = "workpen"
path = "src/main.rs"

# Archives are workpen-cli-<triple>.tar.gz and the file inside is `workpen`.
# 0.7.0 publishes Linux and macOS, x86_64 and arm64.
# v0.6.0 published only the Linux x86_64 archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/workpen-cli-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "workpen{ binary-ext }"

[dependencies]
workpen = { version = "0.7.0", path = "../workpen", features = ["gc", "nono"] }

[dev-dependencies]
tempfile = "3"

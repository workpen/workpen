[package]
name = "workpen"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Workpen dest-deny and a per-child process jail (Landlock, Seatbelt, Windows)."
publish = true
readme = "../../README.md"
keywords = ["sandbox", "landlock", "seatbelt", "security", "process"]
categories = ["os", "command-line-utilities"]

[features]
default = []
gc = []
nono = ["dep:nono"]

[dependencies]
dunce = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
nono = { version = "0.78", optional = true, default-features = false }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[test]]
name = "gc_corpus"
required-features = ["gc"]

[[test]]
name = "nono_corpus"
required-features = ["nono"]

# Publish on a vX.Y.Z tag via crates.io trusted publishing (OIDC).
# Do not publish until a human says launch. publish = false until then.
name: Publish crates.io

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: publish-crates-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates.io
    if: github.event_name != 'push' || github.event.created
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # crates.io trusted publishing (OIDC)
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.95"
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Refuse while unpublished
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          echo "publish = false on crates; skip cargo publish"
          grep -q 'publish = false' crates/workpen/Cargo.toml

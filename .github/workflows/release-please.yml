# Cheap promote job on push to main. Does not compile the crate.
# The workpen-release app creates the tag and the GitHub Release.
# That identity starts sign-release and publish-crates. The default
# Actions token does not.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # release-please opens the version PR and later tags
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.rp.outputs.pr }}
      release_created: ${{ steps.rp.outputs.release_created }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-release-pr-versions:
    name: Sync release PR lock
    needs: release-please
    if: >-
      always() && !failure() && !cancelled() &&
      needs.release-please.outputs.pr != '' &&
      needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
      - name: Resolve release-please head
        id: branch
        env:
          PR_JSON: ${{ needs.release-please.outputs.pr }}
        run: |
          set -euo pipefail
          name=$(printf '%s\n' "$PR_JSON" | jq -r '.headBranchName')
          test -n "$name" && test "$name" != "null"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
      - name: Refresh Cargo.lock workspace versions
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          bash scripts/sync-cargo-lock-workspace-versions.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "OK: Cargo.lock already matches crate versions"
            exit 0
          fi
          git commit -s -m "chore: sync Cargo.lock workspace versions"
          git push origin "HEAD:${BRANCH}"


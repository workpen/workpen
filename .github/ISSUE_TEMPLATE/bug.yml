name: Bug
description: A defect in this repository
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Security reports go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "linux, macos, or windows"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Commands and versions. Do not paste secrets.
    validations:
      required: true
